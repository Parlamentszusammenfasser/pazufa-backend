services:
  pazufa-database:
    image: postgres:latest
#    container_name: pazufa-database-dev
    restart: unless-stopped
    ports:
      - 5432:5432
    networks:
      - pazufa-network
    environment:
      POSTGRES_USER: pazufa-user
      POSTGRES_PASSWORD: pazufa-pass
      POSTGRES_DB: pazufa

  pazufa-backend:
    image: pazufa/backend:0.2.11
    restart: unless-stopped
# use `docker compose up --build` to not use the repository image but build yourself instead
    build:
      context: .
      dockerfile: Dockerfile
      network: host
#    container_name: pazufa-backend
      platforms:
        - linux/amd64
    ports:
      - 8080:8080
    depends_on:
      - pazufa-database
    networks:
      - pazufa-network
    environment:
      DATABASE_URL: "postgres://pazufa-user:pazufa-pass@pazufa-database:5432/pazufa" # required
      RUST_LOG: "warn,pazufa_backend=info"                                           # optional
      PAZUFA_PORT: "8080"
      PAZUFA_KEYADDER_KEY: "pazufa-ABRAKADABRAHEXEN-DRACHENSCHUPPENHAARFAERBEMITTELVERORDNUNGSBLATTFASERSTRUKTURWASSERMINDESTAUFNAHMESTEMPELGESETZ1A6a3671b9"             # required
networks:
  pazufa-network:
