services:
  database:
    image: postgres:latest
    container_name: pg-server
    restart: unless-stopped
    ports:
      - 5432:5432
    networks:
      - pazufa-network
    environment:
      POSTGRES_USER: ltzf-user
      POSTGRES_PASSWORD: ltzf-pass
      POSTGRES_DB: ltzf

  pazufa-backend:
    #image: pazufa/backend:0.2.7
    build:
      context: .
      dockerfile: Dockerfile.deploy
      network: host
    container_name: pazufa-backend
    ports:
      - 8080:8080
    depends_on:
      - database
    networks:
      - pazufa-network
    environment:
      DATABASE_URL: "postgres://ltzf-user:ltzf-pass@database:5432/ltzf" # required
      RUST_LOG: "warn,pazufa_backend=info"                                                 # optional
      LTZF_PORT: "8080"
      LTZF_KEYADDER_KEY: "tegernsee-apfelsaft-co2grenzwert"             # required
networks:
  pazufa-network:
