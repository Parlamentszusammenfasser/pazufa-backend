# the variables that are to be set by set-version.py
# these are used in various locations throughout the project
[version]
# this versions pazufa-backend-lib as well as pazufa-backend
backend="0.3.6"
elastic-companion="0.1.0"

test-dockerfile="1.4.0"
# this versions the spec itself, as well as pazufa-models
openapi-spec="0.2.9"

[dependency-version]
rustc = "1.99"

# Base images of docker/Dockerfile, pinned by their multi-platform INDEX digest
# (`docker buildx imagetools inspect <image> --format '{{.Manifest.Digest}}'`),
# never by a single platform's manifest digest.
# builder: rust:<rustc>-slim-bookworm -> update together with rustc
builder-image-digest = "sha256:f2c004e3d2d8b547e8cf7ffbc29205385f4e71d23e53e4e383065db5e9f822cd"
# runners: keep the Debian release in line with the builder (bookworm = debian12)
runtime-image-digest = "sha256:9dac0a79194e45a7da0158a9c6da57b217585af0786db3845d1f0ec1a0dd182f"

[resources]
trackfile="https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/tag/v0.2.9+v0.1.4/tracks.toml"
cached-swagger-ui="https://drive.usercontent.google.com/download?id=1GHIMYle518Qy8aB-AuqasCUYSKN_XRpw&export=download"
testing-database-state="https://drive.usercontent.google.com/download?id=17lXDQ3A9jHdQbwxm73A0RP-t62SB7gpk&export=download&confirm=t&uuid=ae4de399-6414-4978-80bf-1d2dc144cd4c"

# which artifacts are produced in deployment?
[artifacts]
bin-deploy = ["pazufa-backend", "elastic-companion", "prefixmatch", "validate-vorgang"]
txt-deploy = ["tracks.toml", "openapi.yml"]

