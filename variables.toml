# the variables that are to be set by set-version.py
# these are used in various locations throughout the project
[version]
backend="0.3.5"
elastic-companion="0.1.0"

test-dockerfile="1.4.0"
openapi-spec="0.2.8"

[dependency-version]
rustc = "1.99"

[resources]
trackfile="https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/tag/v0.2.7+v0.1.1/tracks.toml"
cached-swagger-ui="https://drive.usercontent.google.com/download?id=1GHIMYle518Qy8aB-AuqasCUYSKN_XRpw&export=download"
testing-database-state="https://drive.usercontent.google.com/download?id=17lXDQ3A9jHdQbwxm73A0RP-t62SB7gpk&export=download&confirm=t&uuid=ae4de399-6414-4978-80bf-1d2dc144cd4c"

# which artifacts are produced in deployment?
[artifacts]
bin-deploy = ["pazufa-backend", "elastic-companion", "prefixmatch", "validate-vorgang"]
txt-deploy = ["tracks.toml", "openapi.yml"]

