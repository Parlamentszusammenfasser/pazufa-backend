
when:
  - event: [ push ]
    path: 
      include: ["track-validation/**"]
      on_empty: false

labels:
  pazufa_scope: generic
  performance: high

steps:
  - name: formatting
    image: rust:1.95-slim-bookworm
    depends_on: []
    commands:
      - cd track-validation
      - rustup component add rustfmt
      - nice cargo fmt --check

  - name: linting
    image: rust:1.95-slim-bookworm
    commands:
      - cd track-validation
      - rustup component add clippy

      - nice cargo check --locked || ( echo "This probably indicates that cargo.lock is not up to date" && exit 1 )
      - nice cargo clippy --all-targets

  - name: testing
    image: rust:1.95-slim-bookworm
    commands:
      - cd track-validation
      - nice cargo test
    environment:
      RUST_BACKTRACE: 1
