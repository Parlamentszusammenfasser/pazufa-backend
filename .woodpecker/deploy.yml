when:
  - event: tag
    branch: main

labels:
  pazufa_scope: generic
  performance: high

steps:
  - name: extract-version
    image: alpine
    commands:
      - VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "//;s/"//')
      - echo "Deploying version $VERSION"
      - echo "PLUGIN_TAG=$VERSION" >> $CI_ENV

  - name: deploy on docker
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    settings:
      repo: pazufa/backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/aarch64
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
