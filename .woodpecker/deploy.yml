when:
  - event: tag
    branch: main
  - event: manual

variables:
  - &version "0.3.5"
  - &companion_version "0.1.0"
  - &build_cache "pazufa/backend:buildcache"
  - &swagger_ui_download_url "https://drive.usercontent.google.com/download?id=1GHIMYle518Qy8aB-AuqasCUYSKN_XRpw&export=download"

labels:
  pazufa_scope: generic
  performance: high

steps:
  # Compiles both binaries once (through the shared `builder` stage) and
  # pushes a mode=max registry cache so whichever target(s) below actually
  # build never recompile from scratch. Only skipped in the abort case above.
  - name: prebuild-cache
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    settings:
      repo: pazufa/backend
      dockerfile: docker/Dockerfile
      context: .
      target: builder
      platforms:
        - linux/amd64
        - linux/aarch64
      dry_run: true
      build_args:
        - SWAGGER_UI_DOWNLOAD_URL: *swagger_ui_download_url
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
    when:
      path: [elastic-companion/Cargo.toml, pazufa-backend/Cargo.toml]

  - name: backend-deploy
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [prebuild-cache]
    settings:
      repo: pazufa/backend
      dockerfile: docker/Dockerfile
      context: .
      target: pazufa-backend-runner
      platforms:
        - linux/amd64
        - linux/aarch64
      tag: 
        - *version
        - latest
      build_args:
        - SWAGGER_UI_DOWNLOAD_URL: *swagger_ui_download_url
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
    when:
      path: [pazufa-backend/Cargo.toml]

  - name: ec-deploy
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [prebuild-cache]
    settings:
      repo: pazufa/elastic-companion
      dockerfile: docker/Dockerfile
      context: .
      target: elastic-companion-runner
      platforms:
        - linux/amd64
        - linux/aarch64
      tags: 
        - *companion_version
        - latest
      build_args:
        - SWAGGER_UI_DOWNLOAD_URL: *swagger_ui_download_url
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
    when:
      path: [elastic-companion/Cargo.toml]

  # Builds the `release-artifacts` target out of the build cache and writes
  # the binaries to dist/linux_amd64/ and dist/linux_arm64/.
  - name: artifacts-export
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [prebuild-cache]
    settings:
      repo: pazufa/release-binaries
      dockerfile: docker/Dockerfile
      context: .
      target: release-artifacts
      platforms:
        - linux/amd64
        - linux/aarch64
      build_args:
        - SWAGGER_UI_DOWNLOAD_URL: *swagger_ui_download_url
      cache_images:
        - *build_cache
      tags: 
        - *version
        - latest
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
    when:
      path: [elastic-companion/Cargo.toml, pazufa-backend/Cargo.toml]
