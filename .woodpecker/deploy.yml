when:
  - event: tag
    branch: main
  - event: manual

variables:
  - &version "0.3.1"
  - &companion_version "0.1.0"

labels:
  pazufa_scope: generic
  performance: high

steps:
  - name: check-backend-tag-exists
    image: alpine
    commands:
      - apk add --no-cache curl
      - PB_VERSION=$(grep '^version' pazufa-backend/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
      - PB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/pazufa/backend/tags/$PB_VERSION/")
      - |
        if [ "$$PB_STATUS" = "200" ]; then
          echo "ERROR: All tagged repositories have a pre-existing tag"
          echo "pazufa/backend.............200"
          echo "To fix this bump at least one version"
          exit 1
        fi
        echo "pazufa/backend.............$$PB_STATUS"

  - name: check-ec-tag-exists
    image: alpine
    commands:
      - apk add --no-cache curl
      - EC_VERSION=$(grep '^version' elastic-companion/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
      - EC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/pazufa/elastic-companion/tags/$EC_VERSION/")
      - |
        if [ "$$EC_STATUS" = "200" ]; then
          echo "ERROR: All tagged repositories have a pre-existing tag"
          echo "pazufa/elastic-companion...200"
          echo "To fix this bump at least one version"
          exit 1
        fi
        echo "pazufa/elastic-companion...$$EC_STATUS"

  - name: backend-deploy
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [check-backend-tag-exists]
    settings:
      repo: pazufa/backend
      dockerfile: docker/Dockerfile
      context: .
      target: pazufa-backend-runner
      platforms: 
        - linux/amd64
        - linux/aarch64
      tag: *version
      username: pazufa
      password:
        from_secret: pazufa-docker-pass

  - name: ec-deploy
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [check-ec-tag-exists, backend-deploy]
    settings:
      repo: pazufa/elastic-companion
      dockerfile: docker/Dockerfile
      context: .
      target: elastic-companion-runner
      platforms: 
        - linux/amd64
        - linux/aarch64
      tag: *companion_version
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
