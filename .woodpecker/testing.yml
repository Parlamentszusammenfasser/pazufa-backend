when:
  - event: [ push ]

labels:
  pazufa_scope: generic
  performance: high

variables:
  - &trackpath "https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/tag/v0.2.3+0.0.5/docs/specs/tracks.toml"
  - &dburl "postgres://pazufa-user:pazufa-pass@database:5432/pazufadb"

services:
  - name: database
    image: postgres
    environment:
      POSTGRES_USER: pazufa-user
      POSTGRES_PASSWORD: pazufa-pass
      POSTGRES_DB: pazufadb

steps:
  - name: formatting
    image: rust:1.95-bookworm
    commands:
      - rustup component add rustfmt
      - nice cargo fmt --check
    environment:
      SQLX_OFFLINE: true
  - name: auditing
    image: rust:1.95-bookworm
    commands:
      - nice cargo install cargo-audit
      - nice cargo audit 

  - name: checking-linting
    image: rust:1.95-bookworm
    commands:
      - nice cargo check --locked || ( echo "This probably indicates that cargo.lock is not up to date" && exit 1 )
      - rustup component add clippy
      - nice cargo clippy --all-targets
    environment:
      SQLX_OFFLINE: true

  - name: setupdb
    image: rust:1.95-bookworm
    commands:
      - curl -o tracks.toml $TP
      # setup database
      - nice cargo install sqlx-cli  --no-default-features --features postgres,native-tls
      - sqlx database reset -yf
      - nice cargo sqlx prepare --check -- --all-targets
    environment:
      TP: *trackpath
      DATABASE_URL: *dburl

  - name: testing
    depends_on: [setupdb]
    image: rust:1.95-bookworm
    commands:
      - nice cargo test
    environment:
      PAZUFA_TRACKFILE: tracks.toml
      DATABASE_URL: *dburl
      SQLX_OFFLINE: false
      RUST_BACKTRACE: 1
