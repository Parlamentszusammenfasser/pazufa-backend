when:
  - event: [ push ]

labels:
  pazufa_scope: generic
  performance: high


services:
  - name: database
    image: postgres
    environment:
      POSTGRES_USER: pazufa-user
      POSTGRES_PASSWORD: pazufa-pass
      POSTGRES_DB: pazufadb
      
steps:
  - name: formatting
    image: rust:1.95-slim-bookworm
    commands:
      - rustup component add rustfmt
      - nice cargo fmt --check
    environment:
      SQLX_OFFLINE: true

  - name: linting & testing
    image: rust:1.95-slim-bookworm
    commands:
      - rustup component add clippy

      - apt update -qq && apt install git curl pkg-config libssl-dev libpq5 -yqq --no-install-recommends > /dev/null
      # setup database
      - nice cargo install sqlx-cli  --no-default-features --features postgres,native-tls

      # check if queries are offlined
      - sqlx database reset -yf
      - nice cargo sqlx prepare --check

      # run tests / linting
      - nice cargo check --locked || ( echo "This probably indicates that cargo.lock is not up to date" && exit 1 )
      - curl -o tracks.toml $TRACK_PATH
      - cd track-validation && nice cargo clippy --all-targets
      - nice cargo test && cd ..
      - nice cargo clippy --all-targets
      - nice cargo test
    environment:
      TRACK_PATH: https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/tag/v0.2.3+0.0.5/docs/specs/tracks.toml
      DATABASE_URL: postgres://pazufa-user:pazufa-pass@database:5432/pazufadb
      SQLX_OFFLINE: false
      RUST_BACKTRACE: 1
      PAZUFA_TRACKFILE: tracks.toml
