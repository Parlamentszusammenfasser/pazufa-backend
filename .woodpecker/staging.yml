when:
  - event: [pull_request]
    branch: [main]

variables:
  - &build_cache "pazufa/backend:buildcache-staging"
  - &swagger_ui_download_url "https://drive.usercontent.google.com/download?id=1GHIMYle518Qy8aB-AuqasCUYSKN_XRpw&export=download"

labels:
  pazufa_scope: generic
  performance: high

steps:
  - name: check-tags
    image: alpine
    commands:
      - apk add --no-cache curl
      - ( sh .woodpecker/docker-tag-free.sh pazufa-backend backend || sh .woodpecker/docker-tag-free.sh elastic-companion elastic-companion ) && exit 0
      - echo "Both image tags are not available. Aborting"
      - exit 1

  - name: gate-backend
    image: alpine
    failure: ignore
    depends_on: [check-tags]
    commands:
      - sh .woodpecker/docker-tag-free.sh pazufa-backend backend && echo "Backend will be built" && exit 0
      - echo "pazufa/backend tag is taken - backend-deploy will not run"
      - exit 1

  - name: gate-ec
    image: alpine
    failure: ignore
    depends_on: [check-tags]
    commands:
      - sh .woodpecker/docker-tag-free.sh elastic-companion elastic-companion && echo "EC will be built" && exit 0
      - echo "pazufa/elastic-companion tag is taken - ec-deploy will run"
      - exit 1

  - name: prebuild-cache
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [check-tags]
    settings:
      repo: pazufa/backend
      dockerfile: docker/Dockerfile
      context: .
      target: builder
      platforms:
        - linux/amd64
      dry_run: true
      build_args:
        - SWAGGER_UI_DOWNLOAD_URL: *swagger_ui_download_url
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass

  - name: build-amd64-dry-run-pb
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [prebuild-cache, gate-backend]
    settings:
      target: pazufa-backend-runner
      dockerfile: docker/Dockerfile
      context: .
      platforms:
        - linux/amd64
      dry_run: true
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass

  - name: build-amd64-dry-run-ec
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [prebuild-cache, gate-ec]
    settings:
      target: elastic-companion-runner
      dockerfile: docker/Dockerfile
      context: .
      platforms:
        - linux/amd64
      dry_run: true
      build_args:
        - SWAGGER_UI_DOWNLOAD_URL: *swagger_ui_download_url
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
