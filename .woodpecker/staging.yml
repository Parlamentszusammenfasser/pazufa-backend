when:
  - event: [pull_request]
    branch: [main]

variables:
  - &build_cache "pazufa/backend:buildcache-staging"

labels:
  pazufa_scope: generic
  performance: high

steps:
  - name: check-tag-exists
    image: alpine
    commands:
      - apk add --no-cache curl
      - ( sh .woodpecker/docker-tag-free.sh pazufa-backend backend || sh .woodpecker/docker-tag-free.sh elastic-companion elastic-companion ) && exit 0
      - echo "Both image tags are not available. Aborting"
      - exit 1

  # Compiles both binaries once (through the shared `builder` stage) and
  # pushes a mode=max registry cache so the two target checks below never
  # recompile - dry-run still exports cache, it only skips the image push.
  - name: prebuild-cache
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [check-tag-exists]
    settings:
      repo: pazufa/backend
      dockerfile: docker/Dockerfile
      context: .
      target: builder
      platforms:
        - linux/amd64
      dry_run: true
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass

  - name: build-amd64-dry-run-pb
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [prebuild-cache]
    settings:
      target: pazufa-backend-runner
      dockerfile: docker/Dockerfile
      context: .
      platforms:
        - linux/amd64
      dry_run: true
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass

  - name: build-amd64-dry-run-ec
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    depends_on: [prebuild-cache]
    settings:
      target: elastic-companion-runner
      dockerfile: docker/Dockerfile
      context: .
      platforms:
        - linux/amd64
      dry_run: true
      cache_images:
        - *build_cache
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
