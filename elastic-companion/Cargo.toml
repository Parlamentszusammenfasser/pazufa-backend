[package]
name = "elastic-companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Benedikt Schäfer"]

[dependencies]
anyhow   = "1.0"
base64 = "0.23.1"
chrono   = { version = "0.4", features = ["serde"] }
clap     = { version = "4.5", features = ["derive", "env", "cargo"] }
dotenvy  = "0.15"
pazufa-backend-lib = { path = "../pazufa-backend-lib" }

reqwest  = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }

serde = { version = "1.0.229", features = ["derive", "alloc"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"], default-features = false }

tokio  = { version = "1.0", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.24.0"

[lints]
workspace = true
