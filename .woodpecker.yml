when:
  - event: [ push ]

variables:
  - &version "0.2.8"

labels:
  pazufa_scope: generic
  performance: high


services:
  - name: database
    image: postgres
    environment:
      POSTGRES_USER: pazufa-user
      POSTGRES_PASSWORD: pazufa-pass
      POSTGRES_DB: pazufadb
      
steps:
  - name: formatting
    image: rust:1.92-slim-bookworm
    commands:
      - rustup component add rustfmt
      - nice cargo fmt --check
    environment:
      SQLX_OFFLINE: true

  - name: linting & testing
    image: rust:1.92-slim-bookworm
    commands:
      - rustup component add clippy
      - apt update -qq && apt install git maven curl pkg-config libssl-dev libpq5 -yqq --no-install-recommends > /dev/null
      # install openapi generator + execute it
      - curl -o openapi-generator-cli.jar https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/$OPENAPI_GENERATOR_VERSION/openapi-generator-cli-$OPENAPI_GENERATOR_VERSION.jar 
      - curl -o openapi.yml $SPEC_PATH
      - curl -o tracks.toml $TRACK_PATH
      - java -jar openapi-generator-cli.jar generate -g rust-axum -i openapi.yml -o oapicode > /dev/null

      # setup database
      - cargo install sqlx-cli  --no-default-features --features postgres,native-tls

      # check if queries are offlined
      - sqlx database reset -yf
      - cargo sqlx prepare --check

      # run tests / linting
      - nice cargo clippy --all-targets
      - nice cargo test
    environment:
      SPEC_PATH: https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/tag/v0.2.3/docs/specs/openapi.yml
      TRACK_PATH: https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/commit/32c125523ec1831edb1fdb73de5dd99d313dae9b/docs/specs/tracks.toml
      OPENAPI_GENERATOR_VERSION: 7.20.0
      DATABASE_URL: postgres://pazufa-user:pazufa-pass@database:5432/pazufadb
      SQLX_OFFLINE: false
      RUST_BACKTRACE: 1
      PAZUFA_TRACKFILE: tracks.toml

  - name: deploy on docker
    image: docker.io/woodpeckerci/plugin-docker-buildx:6
    settings:
      repo: pazufa/backend
      dockerfile: Dockerfile.deploy
      platforms: linux/amd64
      tag: *version
      username: pazufa
      password:
        from_secret: pazufa-docker-pass
    when:
      - event: tag
