[package]
name = "pazufa-models"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.1.2"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "std"] }
axum = "0.8"

base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
crc = "3.4.0"
headers = "0.4.1"
rand = { version = "0.10"}

serde = { version = "1.0", features = ["alloc", "derive"] }
serde_json = "1.0"
serde_repr = "0.1.21"
sha256 = "1.5"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"], default-features = false }

tokio = { version = "1.0", features = ["sync", "macros", "rt-multi-thread", "signal"] }
utoipa = { version = "6.0.0", features = ["uuid", "url", "axum_extras", "chrono", "repr"] }
uuid = { version = "1.0", features = ["fast-rng", "serde", "v5", "v7"] }

[lints]
workspace = true
