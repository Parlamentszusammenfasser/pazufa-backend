[package]
name = "pazufa-models"
version = "0.2.8"
edition = "2024"

[dependencies]
ammonia = "4.1.2"
arbitrary = { version = "1.5", features = ["derive"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "std"] }
axum = "0.8"

base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde", "arbitrary"] }
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
clap-stdin = "0.8.1"
crc = "3.4.0"
headers = "0.4.1"
rand = { version = "0.10"}

serde = { version = "1.0", features = ["alloc", "derive"] }
serde_json = "1.0"
serde_repr = "0.1.21"
sha256 = "1.5"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"], default-features = false }

tokio = { version = "1.0", features = ["sync", "macros", "rt-multi-thread", "signal"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
track-validation = {path = "../track-validation"}

utoipa = { version = "6.0.0", features = ["uuid", "url", "axum_extras", "chrono", "repr"] }
uuid = { version = "1.0", features = ["fast-rng", "serde", "v5", "v7", "arbitrary"] }

[dev-dependencies]
tracing-test = "0.2.5"

[lints]
workspace = true
