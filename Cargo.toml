[package]
name = "pazufa-backend"
version = "0.2.12"
edition = "2024"
rust-version = "1.95"
authors = ["Benedikt Schäfer"]

[lib]
name = "pazufa_backend_lib"
bench = false

[[bin]]
name = "pazufa-backend"
bench = false

[features]
default = ["track-validation"]
track-validation = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]

ammonia = "4.1.2"
anyhow = "1.0.102"
axum = "0.8"

chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
crc = "3.4.0"

dotenvy = "0.15"
headers = "0.4.1"
lettre = "0.11"

rand = "0.10"

serde = { version = "1.0", features = ["alloc", "derive"] }
serde_json = "1.0"
sha256 = "1.5"
snafu = "0.9"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"], default-features = false }

tokio = { version = "1.0", features = ["sync", "macros", "rt-multi-thread", "signal"] }
toml = { version = "1.0.7", features = ["serde"] }
tower-http = { version = "0.6", features = ["limit", "cors", "compression-br", "compression-deflate", "compression-gzip", "compression-zstd"] }
tower_governor = { version = "0.8" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
track-validation = {path = "track-validation"}

utoipa = { version = "5.4.0", features = ["uuid", "url", "axum_extras", "chrono"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "reqwest"] }
uuid = { version = "1.0", features = ["fast-rng", "serde", "v5", "v7"] }

[dev-dependencies]
tracing-test = "0.2.5"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
checked_conversions = "deny"
cloned_instead_of_copied = "deny"
copy_iterator = "deny"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
too_many_arguments = "warn"
arithmetic_side_effects = "warn"
type_complexity = "warn"
expect_used = "warn"
